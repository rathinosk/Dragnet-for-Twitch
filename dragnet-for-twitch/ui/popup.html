<!-- Toolbar popup: the campaign list, with the filters behind the funnel button. Text comes from _locales: app.js fills the data-i18n attributes (ui/i18n.js) and
     sets lang. -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="extShortName"></title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="dragnet.css">
  <script type="module" src="app.js"></script>
</head>
<body data-view="popup">
  <header class="topbar">
    <img class="logo" src="../icons/icon-32.png" alt="" width="24" height="24">
    <h1 data-i18n="extShortName"></h1>
    <nav class="nav">
      <a class="btn" href="https://www.twitch.tv/drops/campaigns" target="_blank" rel="noopener" data-i18n="openCampaigns" data-i18n-title="openCampaignsTitle"></a>
      <a class="btn" href="https://www.twitch.tv/drops/inventory" target="_blank" rel="noopener" data-i18n="openInventory" data-i18n-title="openInventoryTitle"></a>
    </nav>
    <span class="spacer"></span>
    <button id="sync" class="btn primary" type="button" data-i18n-title="fullSyncTitle">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 0 1-9.9 3.3M2.5 8a5.5 5.5 0 0 1 9.9-3.3M12.5 1.5v3.2H9.3M3.5 14.5v-3.2h3.2"/></svg>
      <span data-i18n="fullSync"></span>
    </button>
    <!-- Shown by common.js while the diagnostics setting is on. -->
    <a id="diag-button" class="icon-btn diag-btn" href="../diag/diagnostics.html" target="_blank" rel="noopener" data-i18n-title="diagnosticsTitle" data-i18n-aria-label="diagnosticsTitle" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8.5h3l1.5-4 3 8 1.5-4h4"/></svg>
      <span id="diag-count" class="diag-count" hidden></span>
    </a>
    <button id="filters-button" class="icon-btn filters-btn" type="button" aria-expanded="false" aria-controls="filters" data-i18n-title="filtersHeading" data-i18n-aria-label="filtersHeading">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5h12L9.5 8v4.5l-3 1.5V8Z"/></svg>
    </button>
    <a class="icon-btn" href="settings.html" target="_blank" rel="noopener" data-i18n-title="settingsTitle" data-i18n-aria-label="settingsTitle">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M6.9 1.5h2.2l.4 1.8 1.2.7 1.8-.6 1.1 1.9-1.4 1.3v1.4l1.4 1.3-1.1 1.9-1.8-.6-1.2.7-.4 1.8H6.9l-.4-1.8-1.2-.7-1.8.6-1.1-1.9 1.4-1.3V7.3L2.4 6l1.1-1.9 1.8.6 1.2-.7Z"/></svg>
    </a>
    <a id="language-button" class="icon-btn" href="settings.html#language" target="_blank" rel="noopener"></a>
    <a class="icon-btn" href="help.html" target="_blank" rel="noopener" data-i18n-title="helpButton" data-i18n-aria-label="helpButton">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M6.2 6.3a1.9 1.9 0 0 1 3.7.5c0 1.3-1.9 1.6-1.9 2.8M8 11.6v.1"/></svg>
    </a>
    <button id="open-page" class="icon-btn" type="button" data-i18n-title="openFullView" data-i18n-aria-label="openFullView">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5 8 8M6.5 3.5h-3v9h9v-3"/></svg>
    </button>
  </header>
  <div id="health" class="banner" role="alert" hidden>
    <strong data-i18n="healthIntro"></strong>
    <ul id="warnings"></ul>
  </div>
  <!-- Stall detection (core/stall.js): filled by app.js from session storage. -->
  <div id="stalls" class="stalls" role="status" hidden></div>
  <div class="layout">
    <main id="main">
      <div class="toolbar">
        <input id="search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="searchLabel">
        <div class="segmented" role="radiogroup" data-i18n-aria-label="groupByLabel">
          <input id="group-expiry" type="radio" name="group-by" value="expiry"><label for="group-expiry" data-i18n="groupByExpiry"></label>
          <input id="group-game" type="radio" name="group-by" value="game"><label for="group-game" data-i18n="groupByGame"></label>
        </div>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <div id="campaigns"></div>
      <p id="empty" class="empty" hidden></p>
    </main>
    <aside id="filters" class="filters" hidden>
      <h2 data-i18n="filtersHeading"></h2>
      <div class="setting">
        <div class="setting-text">
          <label for="hide-complete" data-i18n="hideCompleteLabel"></label>
        </div>
        <input id="hide-complete" class="switch" type="checkbox" role="switch">
      </div>
      <div class="setting">
        <div class="setting-text">
          <label for="hide-sub-drops" data-i18n="hideSubDropsLabel"></label>
        </div>
        <input id="hide-sub-drops" class="switch" type="checkbox" role="switch">
      </div>
      <label class="field">
        <span class="field-label" data-i18n="connectionFilterLabel"></span>
        <select id="connection-filter"></select>
      </label>
      <div class="field">
        <span id="games-label" class="field-label" data-i18n="gameFilterLabel"></span>
        <div class="segmented wide" role="radiogroup" aria-labelledby="games-label">
          <input id="game-mode-hide" type="radio" name="game-mode" value="hide"><label for="game-mode-hide" data-i18n="gameFilterHide"></label>
          <input id="game-mode-include" type="radio" name="game-mode" value="include"><label for="game-mode-include" data-i18n="gameFilterInclude"></label>
        </div>
      </div>
      <div class="games-box">
        <div class="games-tools">
          <input id="game-search" type="search" autocomplete="off" data-i18n-placeholder="gameSearchPlaceholder" data-i18n-aria-label="gameSearchPlaceholder">
          <button id="games-clear" class="btn small" type="button" data-i18n="gamesClear"></button>
        </div>
        <ul id="games" aria-labelledby="games-label"></ul>
      </div>
    </aside>
  </div>
  <footer>
    <span>Copyright &copy; 2026 - Rathinosk™. <span data-i18n="unaffiliated"></span></span>
  </footer>
</body>
</html>
